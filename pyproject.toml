[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "social-pulse"
version = "3.1.0"
description = "Headless Chinese social-media analytics and data-quality CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gaaiyun"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "python-dateutil>=2.8",
]

[project.scripts]
social-pulse = "social_pulse_cli:main"

[project.optional-dependencies]
sentiment = ["snownlp>=0.12.3"]
dashboard = ["plotly>=5.19", "streamlit>=1.32"]
llm = ["anthropic>=0.25", "openai>=1.30"]
test = [
    "build>=1.2",
    "plotly>=5.19",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "snownlp>=0.12.3",
    "streamlit>=1.32",
]

[tool.setuptools]
py-modules = [
    "content_analyzer",
    "dashboard",
    "fan_analyzer",
    "headless_analytics",
    "llm_insights",
    "sentiment_analyzer",
    "social_pulse_cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=html --cov-report=term"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/test_*",
    "generate_sample_data.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
